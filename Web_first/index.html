<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F&Z Gallery Store</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Georgia, serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #d8f3dc 0%, #e8d5f2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .landing {
      padding: 40px;
    }

    h1 {
      color: #5b3d8a;
      font-size: 2.8rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
      font-weight: 400;
    }

    p {
      color: #4a7a5a;
      font-size: 1rem;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .btn-enter {
      display: inline-block;
      padding: 14px 40px;
      background: transparent;
      border: 1px solid #a685c9;
      color: #5b3d8a;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .btn-enter:hover {
      background: #a685c9;
      color: #fff;
    }

       .disclaimer {
      margin-top: 90px;
      margin-left: auto;
      margin-right: auto;
      font-size: 0.85rem;
      color: #999;
      letter-spacing: 0.5px;
      max-width: 420px;
      text-align: center;
    }

    .disclaimer a {
      color: #a685c9;
      text-decoration: underline;
    }

    .disclaimer a:hover {
      color: #5b3d8a;
    }
  </style>
</head>
<body>

  <div class="landing">
    <h1>Welcome to F&Z Gallery Store</h1>
    <p>Where elegance meets curation</p>
    <a href="home.html" class="btn-enter">Enter Store</a>
    <p class="disclaimer">This website was built for learning purposes. Images used are sourced from <a href="https://www.pinterest.com" target="_blank">Pinterest</a> and edited with Gemini.</p>
  </div>

</body>
</html>
